<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>D3 Sankey Diagram - Data Pipeline</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
</head>

<body>

<h2>D3.js Sankey Diagram - Data Pipeline</h2>

<div id="sankey"></div>

<script>

const width = 1000;
const height = 550;

const nodes = [
    {name: "Web Logs"},
    {name: "Mobile App"},
    {name: "CRM Export"},
    {name: "Data Cleaning"},
    {name: "Rejected"},
    {name: "EDA"},
    {name: "Feature Engineering"},
    {name: "Model Training"},
    {name: "Evaluation"},
    {name: "Visualization"},
    {name: "Deployment"}
];

const links = [
    {source: "Web Logs", target: "Data Cleaning", value: 5000},
    {source: "Mobile App", target: "Data Cleaning", value: 3000},
    {source: "CRM Export", target: "Data Cleaning", value: 2000},

    {source: "Data Cleaning", target: "EDA", value: 8500},
    {source: "Data Cleaning", target: "Rejected", value: 1500},

    {source: "EDA", target: "Feature Engineering", value: 6000},
    {source: "EDA", target: "Visualization", value: 2500},

    {source: "Feature Engineering", target: "Model Training", value: 4800},
    {source: "Feature Engineering", target: "Evaluation", value: 1200},

    {source: "Model Training", target: "Evaluation", value: 4800},

    {source: "Evaluation", target: "Deployment", value: 5000},
    {source: "Evaluation", target: "Visualization", value: 1000}
];

const svg = d3.select("#sankey")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

const sankey = d3.sankey()
    .nodeId(d => d.name)
    .nodeWidth(20)
    .nodePadding(20)
    .extent([[20, 20], [width - 20, height - 20]]);

const graph = sankey({
    nodes: nodes.map(d => ({...d})),
    links: links.map(d => ({...d}))
});

svg.append("g")
    .selectAll("path")
    .data(graph.links)
    .enter()
    .append("path")
    .attr("d", d3.sankeyLinkHorizontal())
    .attr("fill", "none")
    .attr("stroke", "#999")
    .attr("stroke-opacity", 0.5)
    .attr("stroke-width", d => Math.max(1, d.width));

svg.append("g")
    .selectAll("rect")
    .data(graph.nodes)
    .enter()
    .append("rect")
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("width", d => d.x1 - d.x0)
    .attr("height", d => d.y1 - d.y0)
    .attr("fill", "#4C78A8");

svg.append("g")
    .selectAll("text")
    .data(graph.nodes)
    .enter()
    .append("text")
    .text(d => d.name)
    .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
    .attr("y", d => (d.y0 + d.y1) / 2)
    .attr("dy", "0.35em")
    .attr("font-size", "13px")
    .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end");

</script>

</body>
</html>
